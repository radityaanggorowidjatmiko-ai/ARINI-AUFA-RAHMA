<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Arini Aufa Rahma</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Georgia', serif;
            overflow: hidden;
            color: #fff;
        }

        /* Styling Video Background */
        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1000;
            object-fit: cover;
            filter: brightness(0.9);
        }

        /* Konten Utama di Atas Video */
        .content-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
        }

        .subtitle-top {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #ffd1dc;
        }

        h1 {
            font-size: 42px;
            font-style: italic;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .subtitle-bottom {
            font-size: 14px;
            margin-bottom: 30px;
            color: #fce4ec;
        }

        /* Kotak Input Password & Tombol */
        .passcode-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 14px;
            outline: none;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: #f3e5f5;
        }

        .input-group input:focus {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.25);
        }

        .input-group span {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 15px;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Video -->
    <video autoplay muted loop playsinline class="video-background">
        <source src="background.mp4" type="video/mp4">
        Browser Anda tidak mendukung tag video.
    </video>

    <!-- Halaman / Slide Login -->
    <div id="login-section" class="content-container">
        <div class="subtitle-top">a little world made for you ♡</div>
        <h1>For Arini Aufa Rahma</h1>
        <div class="subtitle-bottom">A small surprise is waiting<br>beneath the moonlight.</div>

        <div class="passcode-box">
            <div class="input-group">
                <span>🔒</span>
                <input type="password" id="passcode" placeholder="Enter the code">
            </div>
            <!-- Tombol dengan tulisan Aeluna yang berfungsi mengecek password -->
            <button class="btn-submit" onclick="checkPassword()">Aeluna</button>
        </div>
    </div>

    <!-- Halaman / Slide Utama (Awalnya disembunyikan) -->
    <div id="main-content" style="display: none; padding: 50px; text-align: center;">
        <h1>Selamat Datang, Arini! 🎉</h1>
        <p>Isi slide atau halaman selanjutnya berhasil dibuka.</p>
    </div>

    <script>
        function checkPassword() {
            const inputCode = document.getElementById('passcode').value;
            
            // Ganti "1912" dengan kode rahasia atau tanggal penting Anda
            const correctCode = "1912"; 

            if (inputCode === correctCode) {
                // Sembunyikan halaman login dan tampilkan konten utama
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                alert("Kode salah, coba masukkan angka yang benar yaa");
            }
        }
    </script>
</body>
</html>
